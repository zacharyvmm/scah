[package]
name = "scah"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CSS selectors meet streaming HTML parsing: extract exactly what you select without building a full DOM."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/scah"
readme = "../../README.md"
keywords = ["css", "selector", "parser", "html", "sax"]
categories = ["parser-implementations", "web-programming"]
exclude = [
    "scripts/**",
]

[lib]
name = "scah"
path = "src/lib.rs"

[dependencies]
smallvec = "1.15.1"
scah-reader.workspace = true
scah-query-ir.workspace = true
scah-macros.workspace = true
# Experimental: structural tape indexing (git dependency until simdlex is published).
simdlex = { git = "https://github.com/zacharyvmm/simdlex", branch = "main" }
tracing = { version = "0.1", optional = true }

[features]
default = []
bench-internals = []
simd-bench-internals = []
otel = ["dep:tracing"]

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
# `--cfg scah_no_layout_hints` drops the `#[cold]` and `#[inline(never)]`
# hints that keep rare paths out of the parse loop, to compare against them
# or to lay the code out with PGO instead (see benches/layout).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(scah_no_layout_hints)"] }

[lints.clippy]
let-and-return = "allow"
byte_char_slices = "allow"
redundant-field-names = "allow"
len_without_is_empty = "allow"
