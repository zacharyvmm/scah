[package]
name = "scah-differential"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Differential tests of the current scah engine against the last release."

# Standalone: see the `exclude` note in the root manifest.
[workspace]

[dependencies]
scah = { path = "../scah" }
# The last published engine, used as the reference implementation.
scah_reference = { package = "scah", version = "=0.1.0", registry = "crates-io" }

[profile.release]
debug-assertions = true
overflow-checks = true
