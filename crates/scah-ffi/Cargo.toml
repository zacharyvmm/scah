[package]
name = "scah-ffi"
description = "Owned query and store handles for scah's foreign-language bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
scah.workspace = true

[dev-dependencies]
# Tests import exported tables with arrow-rs to validate them.
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-data = { version = "60", features = ["ffi"] }
arrow-schema = { version = "60", features = ["ffi"] }
