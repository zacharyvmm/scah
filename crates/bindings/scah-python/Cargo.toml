[package]
name = "scah-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "scah"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
scah-core = { package = "scah", path = "../../scah" }
scah-ffi = { path = "../../scah-ffi" }
pyo3 = { version = "0.27.2", features = ["abi3-py310"] }
pyo3-stub-gen = "0.23.0"
# The polars expression plugin, `scah.polars`. Not pyo3-polars: its `derive`
# feature pulls in polars-plan, polars-io and polars-parquet; see src/polars.rs.
polars-arrow = { version = "0.55", default-features = false }
polars-core = { version = "0.55", default-features = false, features = ["dtype-struct"] }
polars-ffi = { version = "0.55", default-features = false }
serde-pickle = "1"
serde = { version = "1", features = ["derive"] }
