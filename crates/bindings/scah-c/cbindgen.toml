# Regenerate include/scah.h with:
#   cargo run -p scah-c --features header-gen --bin generate_header

language = "C"
cpp_compat = true
include_guard = "SCAH_H"
autogen_warning = "/* Generated by cbindgen from crates/bindings/scah-c. Do not edit by hand. */"
include_version = false
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
header = """
/*
 * scah C API: streaming CSS-selector-driven HTML extraction.
 *
 * Link against libscah_c (static or shared). On Linux, static linking also
 * needs -lpthread -ldl -lm.
 *
 * Workflow
 *   1. Describe a query with a ScahQueryBuilder, nesting child builders with
 *      scah_query_builder_then, and compile it with scah_query_build.
 *   2. Parse HTML against one or more queries with scah_parse.
 *   3. Look up matches with scah_store_get and scah_element_get, then read
 *      element fields with the scah_element_* getters.
 *
 * Ownership
 *   - Every handle returned through an out-pointer is owned by the caller and
 *     released with its *_free function. Every *_free function accepts NULL.
 *   - A store copies its HTML and shares its queries' selector strings, so
 *     the HTML buffer, queries, and builders may be freed as soon as
 *     scah_parse returns.
 *   - Element lists are independent of their store, but their ids are only
 *     meaningful together with the store that produced them.
 *   - String views returned by getters borrow from the store and stay valid
 *     until scah_store_free. The view returned by scah_error_message stays
 *     valid until scah_error_free.
 *   - String views are UTF-8 and are not NUL-terminated.
 *
 * Errors
 *   Fallible functions return a ScahStatus and take a trailing
 *   ScahError **out_error, which may be NULL. On entry the function sets
 *   *out_error to NULL. On failure it stores a newly allocated error there
 *   for the caller to free. Out-pointers for handles are likewise set to NULL
 *   before any work happens. Panics never unwind into C: they are reported as
 *   SCAH_STATUS_INTERNAL_PANIC.
 *
 * Threads
 *   Queries and stores are immutable and may be shared across threads.
 *   Builders, element lists, and errors must not be used from two threads at
 *   once.
 */"""

[export]
prefix = ""

[fn]
sort_by = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
