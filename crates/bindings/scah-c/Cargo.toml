[package]
name = "scah-c"
description = "C ABI for scah"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Not `scah`: scah-python's cdylib already uses that name, and two cdylibs
# with one name overwrite each other's artifacts in the shared target dir.
name = "scah_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "generate_header"
path = "src/bin/generate_header.rs"
required-features = ["header-gen"]

[features]
# Builds the `generate_header` binary, which rewrites include/scah.h.
header-gen = ["dep:cbindgen"]

[dependencies]
scah.workspace = true
scah-ffi = { path = "../../scah-ffi" }
cbindgen = { version = "0.29", optional = true, default-features = false }
