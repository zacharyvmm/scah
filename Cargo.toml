[workspace]
members = [
    "crates/scah-reader",
    "crates/scah-query-ir",
    "crates/scah-macros",
    "crates/scah",
    "crates/bindings/scah-python",
    "crates/bindings/scah-node",
    "benches",
]
# Depends on the published scah, so it keeps its own lockfile: sharing this one
# would put two `scah-reader 0.1.0`s in it and break `cargo package`.
exclude = ["crates/scah-differential"]
default-members = ["crates/scah"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Zachary McSween Manickchand <contact@zacharymm.com>"]
repository = "https://github.com/zacharyvmm/scah"
homepage = "https://github.com/zacharyvmm/scah"

[workspace.dependencies]
scah = { version = "0.1.0", path = "crates/scah" }
scah-reader = { version = "0.1.0", path = "crates/scah-reader" }
scah-query-ir = { version = "0.1.0", path = "crates/scah-query-ir" }
scah-macros = { version = "0.1.0", path = "crates/scah-macros" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
overflow-checks = false
incremental = false
debug = 0
debug-assertions = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"
