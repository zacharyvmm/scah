name: Bug report
description: Wrong results, a crash, or a selector that should work but doesn't
labels: [bug]
body:
  - type: dropdown
    id: binding
    attributes:
      label: Package
      options:
        - Rust (scah)
        - Python (scah)
        - JavaScript (@zacharymm/scah)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.0.21
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The HTML, the query, and the code that runs it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
      description: For matching bugs, a browser's `document.querySelectorAll` result is a useful reference.
    validations:
      required: true
