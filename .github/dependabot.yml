version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Tags on this action are Rust toolchain versions, not action releases;
      # the MSRV job must stay pinned to the declared rust-version.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # napi-derive 3.6 needs napi >= 3.13, which slows the Node binding
      # (element_fields ~1.8x; see #81 and #140). Bump these by hand once
      # the binding performance gate passes.
      - dependency-name: "napi*"
