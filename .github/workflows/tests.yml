name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude scah-benches -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude scah-benches
      - name: Verify generated C header
        run: |
          cargo run -p scah-c --features header-gen --bin generate_header
          git diff --exit-code -- crates/bindings/scah-c/include/scah.h
      - name: Run C and C++ smoke tests
        run: crates/bindings/scah-c/scripts/smoke-test.sh --debug
      - name: Test optimized parser semantics
        run: cargo test --release -p scah
      - name: Compare results with the last release
        run: cargo test --release --manifest-path crates/scah-differential/Cargo.toml
      - name: Test benchmark instrumentation
        run: cargo test -p scah --features bench-internals
      - name: Test optimized implied-close preflight
        run: cargo test -p scah --release implied_close_preflight_matches_reactivated_attribute_cursor
      - name: Verify generated entity table and provenance
        run: |
          python3 crates/scah/scripts/generate_entities.py --self-test
          python3 -m unittest crates/scah/scripts/test_generate_entities.py
          python3 crates/scah/scripts/generate_entities.py
          git diff --exit-code -- crates/scah/src/capture/entities_table.rs
      - name: Verify benchmark report tables
        run: |
          python3 -m unittest benches/report/test_report.py
          python3 benches/report/report.py readme --check \
            README.md \
            crates/bindings/scah-python/README.md \
            crates/bindings/scah-node/README.md
      - name: Verify third-party license notice
        run: |
          test -f crates/scah/THIRD_PARTY_LICENSES/WHATWG-HTML.txt
          grep -F "THIRD_PARTY_LICENSES/WHATWG-HTML.txt" \
            crates/scah/src/capture/entities_table.rs
      - name: Verify scah package contents
        run: |
          cargo package -p scah --list > /tmp/scah-package-files.txt
          cat /tmp/scah-package-files.txt

          grep -Fx "THIRD_PARTY_LICENSES/WHATWG-HTML.txt" \
            /tmp/scah-package-files.txt

          if grep -E '^scripts/' /tmp/scah-package-files.txt; then
            echo "Generator assets were included in the package"
            exit 1
          fi

          # Package the published crates together so their path dependencies
          # resolve to each other. Packaging scah alone resolves them on
          # crates.io, which fails whenever the version has just been bumped.
          cargo package -p scah-html -p scah-store -p scah-query-ir -p scah-macros -p scah
      - name: Check escape scanner benchmark
        run: cargo bench -p scah-benches --bench speed_bench_escape_scanner -- --test
      - name: Check cursor-dominance benchmark
        run: cargo bench -p scah-benches --bench speed_bench_cursor_dominance -- --test
      - name: Check element-tape benchmark
        run: cargo bench -p scah-benches --bench speed_bench_element_tape -- --test
      - name: Check sibling benchmark
        run: cargo bench -p scah-benches --bench speed_bench_sibling -- --test
      - name: Check structural benchmark
        run: cargo bench -p scah-benches --bench speed_bench_structural -- --test
      - name: Check ordinary parser gate benchmark
        run: cargo bench -p scah-benches --bench speed_bench_ordinary_gate -- --test
      # Documentation and benchmark-result changes cannot affect parser performance, and noisy
      # runners would otherwise let them fail the gates spuriously.
      - name: Detect performance-relevant changes
        id: perf-changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**' \
            ':(exclude)benches/results/**' ':(exclude)benches/report/**'; then
            echo "Only documentation or benchmark results changed; skipping performance gates."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      # Both gates measure a pull request's incremental cost against its base,
      # so each layer of a stack is gated before it merges.
      - name: Enforce ordinary parser performance gate
        if: github.event_name == 'pull_request' && steps.perf-changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./benches/gates/check-sibling-performance.sh "$BASE_SHA"
      - name: Check text-extraction benchmark
        run: cargo bench -p scah-benches --bench speed_bench_text_extraction -- --test
      - name: Check text-extraction memory benchmark
        run: cargo bench -p scah-benches --bench memory_bench_text_extraction
      - name: Enforce text-extraction performance gate
        if: github.event_name == 'pull_request' && steps.perf-changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./benches/gates/check-text-performance.sh "$BASE_SHA"

  docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p scah -p scah-store -p scah-html -p scah-query-ir -p scah-macros -p scah-ffi -p scah-c

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - name: Check published crates
        run: cargo check -p scah -p scah-store -p scah-html -p scah-query-ir -p scah-macros

  bindings-performance:
    name: Binding Performance Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only changes that can reach the compiled bindings need the gate.
      - name: Detect binding-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- Cargo.toml Cargo.lock crates \
            benches/gates/bindings benches/gates/check-binding-performance.sh \
            ':(exclude)*.md' ':(exclude)crates/bindings/scah-c/**'; then
            echo "No binding-relevant changes; skipping the binding performance gate."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.relevant == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.relevant == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.relevant == 'true'
      - name: Enforce binding performance gate
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Shared runners are noisier than a local machine.
          SCAH_BINDING_GATE_LIMIT: "1.10"
        run: ./benches/gates/check-binding-performance.sh "$BASE_SHA"

  pgo-changes:
    name: Detect PGO Build Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Release builds run the PGO build on every platform; pull requests run
      # it only when the build itself or the bindings' manifests change.
      - name: Detect PGO-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- Cargo.toml crates/bindings/pgo \
            crates/bindings/scah-python/Cargo.toml crates/bindings/scah-python/pyproject.toml \
            crates/bindings/scah-node/Cargo.toml crates/bindings/scah-node/package.json \
            .github/workflows/bindings-pgo.yml .github/workflows/deploy.yml ':(exclude)*.md'; then
            echo "No PGO-relevant changes; skipping the PGO build."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  bindings-pgo:
    name: Bindings PGO Build (${{ matrix.binding }})
    needs: pgo-changes
    if: needs.pgo-changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        binding: [python, node]
    uses: ./.github/workflows/bindings-pgo.yml
    with:
      binding: ${{ matrix.binding }}

  rust-aarch64:
    name: Rust AArch64 SIMD Checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test SIMD indexer in release mode
        run: cargo test -p scah-html --release
      - name: Check SIMD benchmark targets
        run: cargo bench -p scah-benches --bench speed_bench_element_tape -- --test

  node:
    name: Node Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: crates/bindings/scah-node
        run: bun install --frozen-lockfile

      - name: Build native binding
        working-directory: crates/bindings/scah-node
        run: bun run build:debug

      - name: Run Node tests
        working-directory: crates/bindings/scah-node
        run: bun test

  python:
    name: Python Binding Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest stable CPython.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test tooling
        run: |
          python -m pip install -U pip
          # pyarrow and polars run the Arrow export tests, which skip without them.
          python -m pip install pytest pyarrow polars

      - name: Build and install Python package
        working-directory: crates/bindings/scah-python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: crates/bindings/scah-python
        run: pytest tests/
