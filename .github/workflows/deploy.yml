name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/tests.yml

  rust-publish-html:
    name: Publish scah-html
    needs: [test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish scah-html
        run: cargo publish --manifest-path crates/scah-html/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  rust-publish-store:
    name: Publish scah-store
    needs: [test, rust-publish-html]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish scah-store
        run: cargo publish --manifest-path crates/scah-store/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  rust-publish-query-ir:
    name: Publish scah-query-ir
    needs: [test, rust-publish-html]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish scah-query-ir
        run: cargo publish --manifest-path crates/scah-query-ir/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  rust-publish-macros:
    name: Publish scah-macros
    needs: [test, rust-publish-query-ir]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish scah-macros
        run: cargo publish --manifest-path crates/scah-macros/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  rust-publish:
    name: Publish scah
    needs: [test, rust-publish-html, rust-publish-store, rust-publish-query-ir, rust-publish-macros]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish scah
        run: cargo publish --manifest-path crates/scah/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python-build:
    name: Build Python wheels with PGO
    needs: [test]
    uses: ./.github/workflows/bindings-pgo.yml
    with:
      binding: python

  python-publish:
    name: Publish Python wheels to PyPI
    needs: [python-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  nodejs-build:
    name: Build Node.js addons with PGO
    needs: [test]
    uses: ./.github/workflows/bindings-pgo.yml
    with:
      binding: node

  nodejs-publish:
    name: Publish Node.js Addon to NPM
    needs: [nodejs-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # napi prepublish attaches the .node binaries to a GitHub release.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: crates/bindings/scah-node
        run: bun install
      - name: Download all built addons
        uses: actions/download-artifact@v8
        with:
          pattern: nodejs-addon-*
          path: crates/bindings/scah-node/artifacts
          merge-multiple: true
      - name: Move artifacts
        working-directory: crates/bindings/scah-node
        run: |
          bunx napi create-npm-dirs
          bun run artifacts
      - name: Publish to npm
        working-directory: crates/bindings/scah-node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # npm authenticates with the job's OIDC token, both here and in the
        # per-platform `npm publish` calls that napi prepublish makes.
        run: |
          bun run prepublishOnly
          npm publish --access public --provenance --ignore-scripts
